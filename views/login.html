<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard login | Batter Up Bakery</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--plum-deep); }
  .box { background: #fff; border-radius: 22px; padding: 2.2rem; width: min(380px, 92vw); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .box img { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 1rem; }
  .box h1 { font-size: 1.5rem; }
  .box form { text-align: left; margin-top: 1.2rem; }
  .box .btn { width: 100%; justify-content: center; margin-top: 1rem; }
</style>
</head>
<body>
  <div class="box">
    <img src="/img/logo.jpg" alt="Batter Up Bakery">
    <h1>Order dashboard</h1>
    <div class="err" id="msg" hidden></div>
    <form method="post" action="/admin/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
<script>
  const e = new URLSearchParams(location.search).get('e');
  const msgs = { bad: 'That password is not right. Try again.', wait: 'Too many tries. Wait 15 minutes and try again.', off: 'The dashboard password has not been set up yet.' };
  if (msgs[e]) { const m = document.getElementById('msg'); m.textContent = msgs[e]; m.hidden = false; }
</script>
</body>
</html>
